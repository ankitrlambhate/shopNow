---
# Validates that the configuration applied by site.yml actually took effect.
- name: Verify tools host configuration
  hosts: role_tools
  become: true
  tasks:
    - name: Docker is running
      ansible.builtin.command: docker info --format '{{ "{{.ServerVersion}}" }}'
      changed_when: false

    - name: kubectl is installed
      ansible.builtin.command: kubectl version --client
      changed_when: false

    - name: AWS CLI is installed
      ansible.builtin.command: aws --version
      changed_when: false

    - name: helm is installed
      ansible.builtin.command: helm version --short
      changed_when: false

    - name: node_exporter answers on 9100
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        return_content: false
        status_code: 200
