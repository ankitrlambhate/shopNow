# Headless service: gives the StatefulSet pod the stable DNS name mongo-0.mongo
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: ${NAMESPACE}
  labels:
    app: mongo
spec:
  clusterIP: None
  selector:
    app: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
