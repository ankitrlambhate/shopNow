# Template: ${NAMESPACE} is replaced by the monitoring job (sed). Applied after kube-prometheus-stack is installed.
# 1) shopNow backend: scrapes the /metrics endpoint added to backend/server.js
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shopnow-backend
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - ${NAMESPACE}
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
# 2) ingress-nginx controller metrics (request rates / status codes seen at the edge)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ingress-nginx
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - ingress-nginx
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/component: controller
  endpoints:
    - port: metrics
      interval: 30s
